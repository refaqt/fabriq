[project]
name = "fabriq"
version = "0.1.0"
description = "The platform around Refaqt's open hardware. Its first module is the DOQS design tool."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Refaqt" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "watchfiles>=0.24",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fabriq = "fabriq.cli:main"

[project.entry-points."fabriq.modules"]
doqs = "fabriq.modules.doqs:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabriq"]
artifacts = ["fabriq/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
