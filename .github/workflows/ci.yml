name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: refaqt/doqs
          path: .ci/doqs
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python -m compileall -q fabriq
      - run: uv run pytest -q
        env:
          FABRIQ_TEST_DOQS: ${{ github.workspace }}/.ci/doqs
